<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Empty icon: suppresses the browser's automatic /favicon.ico request so
         it isn't a 404 in the console. A real favicon mark is future work. -->
    <link rel="icon" href="data:,">

    <!--
      The fixed shell — Aluna's one fixed UI surface (ARCH §4, §6.1). The page is
      the desk ground: a wallpaper filling the viewport, every capability standing
      on it as a logo, and the prompt bar floating over both clear of every edge
      (PLAN decisions 1, 3 and 4; design D4, D5). It is not inert after first load:
      the window over that ground is created and destroyed by the client, and
      everything a capability shows happens inside it. The developer panel is the
      one second window and the last one (design D13): read-only furniture, opened
      from its own tile, allowed to sit beside the capability it reports on.
      High Meadow is the shipped product surface; see design/design-system.md.
    -->

    <!-- Aluna is the user-facing brand (ARCH §9.7); the repository's engineering
         name never appears in the UI (not even in this page's source). -->
    <title>Aluna</title>

    <!-- High Meadow ships from its source directory; app.css only bridges the
         temporary Module 1–4 shell onto that token and component layer. -->
    <link rel="stylesheet" href="/design/styles/index.css">
    <!-- app.css ends by re-asserting the ink seam, so the drawn line still takes
         over from the CSS border every sheet above it declares. -->
    <link rel="stylesheet" href="/static/app.css">

    <!--
      Scripts, all vendored/static and deferred (run in document order after the
      DOM is parsed, before DOMContentLoaded). HTMX wires hx-* attributes; the
      SSE extension teaches HTMX the sse-connect / sse-swap / sse-close vocabulary
      that the per-build stream uses to drive swaps (ADR-0002, Epic 2.6).

      Order matters twice:
        - htmx-ext-sse.min.js calls htmx.defineExtension at load, so it must come
          AFTER htmx.min.js.
        - app.js registers the Alpine `shell` component on the `alpine:init`
          event, so it must run BEFORE alpine.min.js — Alpine's cdn build
          auto-starts in a microtask the moment it executes (dispatching
          `alpine:init`), which is before any later deferred script would run.
    -->
    <script defer src="/static/vendor/htmx.min.js"></script>
    <script defer src="/static/vendor/htmx-ext-sse.min.js"></script>
    <script defer src="/static/app.js"></script>
    <script defer src="/static/vendor/alpine.min.js"></script>

    <!--
      The content region's release scope. Whatever a region's content starts is released
      when that content is replaced or removed — one rule for a view swap inside the
      region and for the region going away. Loaded here as the shell's statement that the
      system is on; the modules below import it for their own registrations.
    -->
    <script type="module" src="/static/region-scope.js"></script>

    <!--
      The other half of the same promise. The release scope stops a swap from arriving at
      a region that has gone; this raises on the residual case rather than letting htmx's
      SSE extension drop a `commit` or a `fragment` in silence (ADR-0002 / M5 plan 16).
    -->
    <script type="module" src="/static/swap-target.js"></script>

    <!--
      What a capability shows, inside the one window. Three dumb presentation-glue files
      (ARCH §6.1: the shell places what the server sends, never infers intent):
        - record-view.js — pressing a record swaps the collection out for that record's
          form under a back control, and back swaps the collection in again (M5 plan 1).
        - record-mutations.js — request feedback for the create and update forms, and
          where each one lands once its outcome is known.
        - search-chrome.js — the collection's debounced search controller.
      All three no-op on a page with no capability content, so they are safe to load on
      every shell (cold-start included).
    -->
    <script type="module" src="/static/record-view.js"></script>
    <script type="module" src="/static/record-mutations.js"></script>
    <script type="module" src="/static/search-chrome.js"></script>

    <!--
      Repeated-value controls — the rows a list field is typed into. Delegated on the
      document, so it works in every create/edit form htmx swaps in after page load, and
      it no-ops on a page that has none.
    -->
    <script type="module" src="/static/list-field.js"></script>

    <!--
      The drawn choice controls — the picker's panel, keyboard and typeahead, and the
      segmented row's exclusive press. Mounted after every htmx landing, because the forms
      they stand in arrive long after page load. The radio group needs nothing here: native
      radio inputs already are the control.
    -->
    <script type="module" src="/static/choice-picker.js"></script>

    <!--
      The multi-line control and the character counter. A long-text field grows with what
      is typed and then scrolls — it is never dragged, because a resize grip is the
      operating system's mark and the only one on this surface that would not be ours — and
      a field that declared a max_length counts down beside its guidance. The limit itself
      is the server's: `maxlength` stops the typing and platform mutation validation
      refuses anything longer however it arrived. Mounted on arrival, like the picker.
    -->
    <script type="module" src="/static/long-text-field.js"></script>

    <!--
      Where a validation error is said, and what stops a submission before it is sent. A
      refusal the server marked with `data-error-fields` is moved out of the form's error
      region into each field it names, taking that field's guidance slot; correcting the
      field puts the guidance back. The browser's own required check keeps its refusal and
      loses its foreign tooltip, and the drawn picker — whose value rides a hidden input,
      which no browser validates — gets that refusal back here rather than a round trip
      later.
    -->
    <script type="module" src="/static/field-errors.js"></script>

    <!--
      A capability deletion whose reply never arrived. A destructive action must never
      look like it did nothing, so this asks the server what is actually true and shows
      its answer. It also tells the server what a deletion displaces, so **Keep it** has
      somewhere to go back to.
    -->
    <script type="module" src="/static/capability-deletion.js"></script>

    <!--
      The tile an admitted build stands on the desk. The server sends it as an
      out-of-band sidecar the moment resolution admits a new capability; this places
      the press and takes the tile down at the build's terminal, whatever that
      terminal was (PLAN decision 3). A module, like the two rules above it.
    -->
    <script type="module" src="/static/desk-logos.js"></script>

    <!--
      The prompt bar's one live slot: everything the desk turns down before a build
      starts is explained there, and so is a structured refusal that arrived from the
      desk rather than from inside the window (PLAN decisions 24, 26). A module, like
      the rules above it — nothing calls into it, and the shell glue and the deletion
      module both say what happened and let it place the sentence.
    -->
    <script type="module" src="/static/prompt-bar.js"></script>

    <!--
      The one-attempt rule's client half. A faceless tile arms a single load-triggered
      POST that spends a paid generation; this takes the arming attributes off the moment
      that request starts, so a tile that has already fired cannot be replayed armed by
      anything that later re-processes the DOM it is standing in (ADR-0007). Since 5.6/03
      htmx's history cache is not one of those: nothing carries `hx-push-url`, and the
      desk answers Back by re-rendering the address rather than restoring a snapshot.
    -->
    <script type="module" src="/static/logo-attempt.js"></script>

    <!--
      The short menu that opens on a logo, and the one inline rename form it opens
      (PLAN decision 19). Three ways in — right-click, press-and-hold, and the menu key
      or Shift+F10 — and one component behind all three. The menu and the editor ship
      hidden with each logo, so nothing here builds markup and no round trip stands
      between a right-click and the menu. A module, like the rules above it.
    -->
    <script type="module" src="/static/logo-menu.js"></script>

    <!--
      The one window. `design/scripts/window.js` is the window itself, the way
      `design/scripts/ink.js` is the drawn line; this is the product's half of that
      seam — it owns when the one window exists, what is in it, and what the two lamps
      do. It creates the content region every existing swap addresses, which is why
      the shell no longer carries one.

      It imports the three subjects it is the face of: where a window is remembered, the
      address and its history, and what leaving a running build or evolution costs — the
      question every navigation stands behind since PLAN decision 17.
    -->
    <script type="module" src="/static/desk-window.js"></script>

    <!--
      The one second window (design D13). It shares the frame, the two lamps and the
      three gestures with the one above — a window is a window — and differs in the
      three ways the exception is allowed to: it is never addressed, it may stand
      beside the capability window rather than replacing it, and what is inside it is
      the build's raw stage payloads rather than a product sentence. It keeps the
      second and last presentation record the browser holds, and carries no controls
      of its own: eight readouts and the frame's own two lamps.
    -->
    <script type="module" src="/static/desk-dev-panel.js"></script>

    <!--
      The drawn line. The ink system ships from design/scripts/ the way the token
      layer ships from design/styles/, and /static/ink.js is only the product's half
      of the seam: it names the temporary shell's own chrome and starts the system.
      A module script, so it runs after the document — server-injected fragments
      included — has been parsed; everything that arrives later arrives drawn.
    -->
    <script type="module" src="/static/ink.js"></script>
  </head>

  <!--
    No page of this desk is ever written outside the DOM. htmx snapshots the whole body
    into `sessionStorage` before it touches history — and it touches history on every
    `HX-Replace-Url` a deletion route answers with — which would put the search term, the
    open record and a half-typed edit somewhere they outlive the tab. Nothing below
    capability identity may leave the DOM (design D14; M5 plan 6), and the snapshot is
    never read back either: the desk answers Back by re-rendering the address
    (`public/desk-window.js`), not by restoring a copy of the page.
  -->
  <body hx-history="false">
    <!--
      The shell. Alpine `shell` component (public/app.js) holds one bit of
      presentation state: `promptBusy` (an active build stream is open). It is
      reflected as a class and an attribute the stylesheet keys off; without the
      class the markup renders the correct state, so there's no flash before Alpine.
      The developer panel's own shown/put-away state left with the rail: it is the
      second window now, and a window's state belongs to the window
      (public/desk-dev-panel.js).

      Nothing gates an empty desk. A fresh user gets a wallpaper and a prompt bar,
      and it reads correctly with nothing withheld until a first capability arrives
      (PLAN decision 3).
    -->
    <div class="shell" x-data="shell">
      <!-- Content column — the ground the logos stand on, the window opens over,
           and the prompt bar floats above. It is what all three are positioned
           against, so they share one set of edges and one floor. -->
      <div class="content-column">
        <!-- The logo layer. Every capability the user has, standing on the ground:
             with no taskbar these are the only standing list of what exists, and the
             only way back to a window that was put away (design D4, PLAN decision 3).
             They fill down a column and wrap to the next, taking as many columns as
             the desk's own height and width allow, so there is no ceiling on how many
             a user may make (PLAN decision 4). The server rehydrates them from the
             registry at the placeholder below (src/web/fragments.ts); a commit stands
             one more on the ground out of band. -->
        <div class="desk__logos" id="capability-logos">
          <!-- Capability logos render here. -->

          <!-- The developer tile (design D13). It stands with the apps because it
               is one, last in the flow and after every capability, and it is drawn
               rather than generated so nothing mistakes it for a capability: no
               artwork, and the surface's own line around it.

               Static markup rather than a client-built tile: the panel's own window
               is created by the client, but the way *in* to it should not wait on a
               module, and it is not a capability, so nothing about it comes from the
               registry. It never appears in the capability list and carries none of
               the capability-logo marking the desk's logo handlers key off, which is
               what keeps them from ever treating it as one.

               The tile is a small window — a title bar in the pane gradient over a
               face — because that is what pressing it opens, and because a capability's
               artwork is full-bleed and carries no chrome, so the two can never be
               confused. The mark on the glass is drawn rather than borrowed — a heavy
               prompt in the upper left with the cursor on the line below it, the
               bottom right left empty, which is the composition every terminal icon
               uses. It needs no frame of its own: the tile is already the frame. -->
          <button type="button" class="logo logo--dev" data-dev-tile aria-label="Open Developer">
            <span class="logo-tile logo-tile--dev">
              <svg
                viewBox="0 0 60 43"
                fill="none"
                stroke="currentColor"
                stroke-width="5.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M13 9 L23 17.5 L13 26" />
                <path d="M26 29 H41" />
              </svg>
            </span>
            <span class="logo-label">Developer</span>
          </button>
        </div>

        <!-- The window layer. The desk's ground for the one window, and empty in the
             page: the window itself is created and destroyed by the client
             (/static/desk-window.js), which is why page assembly has no anchor here
             and the shell no longer ships a content area at all. Whatever a
             capability shows — its collection, and the narration of a build — happens
             inside that window (PLAN decision 1; design D1, D2). -->
        <div class="desk__windows"></div>

        <!-- The menu layer. A logo's context menu opens at the tip of the cursor and
             has to stand over everything on the desk, including the window it may
             be opened beside — and the logo layer it is rendered into sits *under*
             the window layer, which is correct for logos and wrong for a menu. So
             the open menu is lifted here for as long as it is open and put back on
             its logo when it closes. Empty in the page: it holds nothing until
             someone asks for a menu (public/logo-menu.js). -->
        <div class="desk__menus" id="capability-menus"></div>

        <!-- The developer panel's one seeded stage. Lifecycle metrics and committed
             versions are known before any stream opens — they are what the platform
             already did — so the server writes them here and the panel picks them up
             when it starts (src/web/cached-view.ts, public/desk-dev-panel.js). It used
             to be written straight into a <pre> in the panel's rail; the panel is a
             window that may not be standing now, so the page carries the payload and
             the panel files it under the stage named here. Empty when there is nothing
             yet to say, and skipped rather than filed. -->
        <div id="dev-stage-seed" data-dev-stage-seed="metrics" hidden></div>

        <!-- Prompt bar — the one thing on the page that belongs to Aluna rather
             than to a capability (design D5). It floats over the ground clear of
             all four edges and is never full width; the strip it floats in is
             --prompt-clearance, and no window may be dragged, resized or
             maximised into it (design/scripts/desk-geometry.js), so a records list
             stops at the bar rather than under it.

             HTMX posts to /prompt; the returned subscriber fragment opens the
             per-build stream. Alpine only mirrors stream lifecycle as a courtesy
             busy presentation state (PLAN decision 7). -->
        <form
          class="prompt"
          id="spec-build-form"
          hx-post="/prompt"
          hx-target="#spec-build-output"
          hx-swap="beforeend"
          :class="{ 'prompt--busy': promptBusy }"
          :aria-busy="promptBusy ? 'true' : 'false'"
        >
          <!-- Above the rail, not below it: below the rail is the ground the bar
               floats over, and a notice there would sit off the bottom of the
               screen or push the bar out of its own strip. -->
          <div id="prompt-notice" class="prompt__notice" aria-live="polite"></div>
          <div class="prompt__composer">
            <input
              class="prompt__field"
              type="text"
              id="spec-build-prompt"
              name="prompt"
              x-ref="promptField"
              :disabled="promptBusy"
              aria-label="Prompt"
              placeholder="What would you like to keep track of?"
            >
            <button
              type="submit"
              class="btn btn--warm prompt__submit"
              id="spec-build-trigger"
              :disabled="promptBusy"
            >
              <span x-text="promptBusy ? 'Making it' : 'Make it'">Make it</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
