name: Deploy architecture tour to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "architecture/**"
      - "design/styles/**"
      - "design/scripts/**"
      - "design/assets/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare architecture site
        run: |
          mkdir -p _site/design
          sed 's#../design/#design/#g' architecture/index.html > _site/index.html
          cp -R architecture/styles _site/styles
          cp -R architecture/scripts _site/scripts
          # Served, the page sits at /architecture/ and its scripts reach design/ two levels
          # up. Flattened onto the site root they are one level away, at any base path.
          sed -i 's#\.\./\.\./design/#../design/#g' _site/scripts/main.js
          cp -R design/styles _site/design/styles
          cp -R design/assets _site/design/assets
          cp -R design/scripts _site/design/scripts

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
